services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: entre-sabores-app:latest
    container_name: entre_sabores_app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "${APP_PORT:-8080}:80"
      - "${REVERB_PORT_EXPOSED:-9090}:${REVERB_SERVER_PORT:-9090}"
    volumes:
      - ./:/var/www/html:delegated
      - ./docker/nginx/web.conf:/etc/nginx/sites-available/laravel:ro
      - ./docker/php/supervisord-laravel.conf:/etc/supervisor/conf.d/laravel.conf:ro
    env_file:
      - .env
    environment:
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "${REVERB_SERVER_PORT:-9090}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-entre_sabores}
      DB_USERNAME: ${DB_USERNAME:-entre_sabores}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DOCKER_LIGHT_START: "${DOCKER_LIGHT_START:-}"
      DOCKER_RUN_SEED: "${DOCKER_RUN_SEED:-}"
      DOCKER_ALWAYS_BUILD_ASSETS: "${DOCKER_ALWAYS_BUILD_ASSETS:-}"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - entre_sabores

  mysql:
    image: mysql:8.0
    container_name: entre_sabores_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-entre_sabores}
      MYSQL_USER: ${DB_USERNAME:-entre_sabores}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT_EXPOSED:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - entre_sabores

  phpmyadmin:
    image: phpmyadmin:apache
    container_name: entre_sabores_pma
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      UPLOAD_LIMIT: 100M
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - entre_sabores

  redis:
    image: redis:7-alpine
    container_name: entre_sabores_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_EXPOSED:-6380}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - entre_sabores

networks:
  entre_sabores:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
